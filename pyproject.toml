[build-system]
requires = ["setuptools", "wheel", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "psd-tools"
dynamic = ["version"]
authors = [
    { name = "Mikhail Korobov", email = "kmike84@gmail.com" },
    { name = "Kota Yamaguchi", email = "KotaYamaguchi1984@gmail.com" },
]
description = "Python package for working with Adobe Photoshop PSD files"
readme = "README.md"
keywords = ["photoshop", "psd"]
license = "MIT"
dependencies = [
    "attrs>=23.0.0",
    "Pillow>=10.3.0",
    "numpy>=1.22",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

[project.optional-dependencies]
composite = [
    "aggdraw>=1.3.16;sys_platform!='win32'",
    "aggdraw>=1.4.1;sys_platform=='win32'",
    "scipy>=1.9",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    {include-group = "test"},
    "ipykernel",
    "ruff",
    "mypy",
    "pre-commit",
    # Include composite dependencies for full development
    "aggdraw>=1.3.16;sys_platform!='win32'",
    "aggdraw>=1.4.1;sys_platform=='win32'",
    "scipy>=1.9",
]
docs = ["sphinx", "sphinx_rtd_theme"]

[project.scripts]
psd-tools = "psd_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psd_tools = ["*.pyx", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "psd_tools.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=psd_tools"
filterwarnings = [
    "ignore:Moving a layer into another document:DeprecationWarning",
]
markers = [
    "composite: marks tests as requiring composite dependencies (aggdraw, scipy)",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.format]
# Ruff 0.16 formats Python code blocks inside Markdown by default; opt out to
# keep the formatter scoped to Python source only.
exclude = ["*.md"]

[tool.ruff.lint]
# Ruff 0.16 greatly expanded the default rule set (59 -> 413 rules). Pin the
# previous defaults so dependency bumps stay behaviour-neutral, and adopt the
# new rules deliberately, a family at a time -- D (#772), I and UP are adopted, with PIE790, SIM300 and RUF100;
# the rest are still being evaluated in #692.
select = ["E4", "E7", "E9", "F"]
extend-select = ["PLC0415", "T10", "D", "I", "UP", "PIE790", "SIM300", "RUF100"]
# Held back deliberately, on noise grounds rather than principle; each is
# tracked in #786.
ignore = [
    # Magic methods and `__init__` are named by the protocol they implement.
    "D105",
    "D107",
    # `%` formatting is kept where a template is built apart from its operands.
    "UP031",
    # `StrEnum` would change `str()` of the public `StrokeAlignment`.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# D401 (imperative mood) is enforced on the public API and the low level. These
# trees describe a value rather than an action ("The layer's own coverage ...").
"src/psd_tools/composite/**" = ["D401"]
# Test names say what is tested.
"tests/**" = ["D1", "D401"]
"tools/**" = ["D401"]

[tool.ruff.lint.pydocstyle]
# pep257, not google or numpy: it is the convention that matches this
# codebase's reST/Sphinx docstrings (`:param x:`), and it leaves D212
# multi-line-summary-first-line disabled. Under `google` that rule alone is
# 453 violations -- a reflow of nearly every multi-line docstring in the tree.
convention = "pep257"

[tool.mypy]
files = ["src/psd_tools", "tests", "tools", "docs/conf.py"]

[tool.cibuildwheel]
archs = "auto64"
# Skip testing during wheel builds - tests are already run in CI test workflow
# Testing here would require composite dependencies which aren't available on all platforms
test-skip = "*"
# Remove any setup.cfg left by a previous build so it cannot bleed into later builds
# (e.g. a cp314 abi3 setup.cfg must not carry over into a cp314t free-threaded build)
before-build = "rm -f setup.cfg"

[[tool.cibuildwheel.overrides]]
select = "cp3{13,14}-{manylinux,musllinux,macos}*"
inherit.before-build = "append"
before-build = "bash tools/configure_abi_tag.sh"

[tool.cibuildwheel.windows]
repair-wheel-command = ["pipx run delvewheel repair -v -w {dest_dir} {wheel}"]

[[tool.cibuildwheel.overrides]]
select = "cp3{13,14}-{manylinux,musllinux,macos}*"
inherit.repair-wheel-command = "append"
repair-wheel-command = "pipx run abi3audit --strict --report {wheel}"
